<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
    .tagline {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.3;
      stroke-width: 1;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.4; }
      50% { transform: scale(1.02); opacity: 0.8; }
      100% { transform: scale(0.98); opacity: 0.4; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Grid Background -->
  <g class="pulse-circle">
    <line x1="0" y1="50" x2="1200" y2="50" class="grid-line" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
    <line x1="0" y1="150" x2="1200" y2="150" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="250" x2="1200" y2="250" class="grid-line" />

    <line x1="200" y1="0" x2="200" y2="300" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="300" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="300" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="300" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Cyber/Radar Nodes (Background Layer) -->
  <g opacity="0.3">
    <circle cx="1050" cy="150" r="120" stroke="#818cf8" stroke-width="1.5" fill="none" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="0 1050 150" to="360 1050 150" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="150" r="80" stroke="#38bdf8" stroke-width="1" fill="none" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="360 1050 150" to="0 1050 150" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="150" r="10" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Scanning Line Behind Text -->
  <path d="M 50 50 Q 300 80 600 50 T 1150 50" stroke="url(#pulse-grad)" stroke-width="3" fill="none" opacity="0.6">
    <animate attributeName="d" 
             values="M 50 50 Q 300 80 600 50 T 1150 50;
                     M 50 250 Q 300 220 600 250 T 1150 250;
                     M 50 50 Q 300 80 600 50 T 1150 50" 
             dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Foreground Content Container -->
  <g transform="translate(60, 0)">
    <!-- Security Shield Icon -->
    <g transform="translate(0, 95)" filter="url(#glow)">
      <path d="M30 10 L55 20 V45 C55 65 40 80 30 85 C20 80 5 65 5 45 V20 Z" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
      <path d="M22 42 L28 48 L38 34" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Header Text Block -->
    <text x="80" y="115" class="tagline">🛡️ Application Security &amp; Runtime Defense Ecosystem</text>
    <text x="80" y="165" class="title" filter="url(#glow)">Awesome Application Detection &amp; Response</text>
    <text x="80" y="205" class="subtitle">A Curated Ecosystem of ADR, RASP, and Runtime Security Solutions</text>
  </g>
</svg>
